Lifecycle:
    RestartOnAppFailure: false

Logging:
    LogLevel:
        Default: Trace

Neomotive:
    Camera: USB
    CameraIndex: 0
    CameraFilePath: ./GOPR1627.MP4

    # Training data capture settings
    FalsePositiveThreshold: 0.30           # Capture detections between 0.30 and threshold
    FalsePositiveCaptureFolder: ./false-positives
    MaxFalsePositiveCaptures: 100

    PositiveCaptureFolder: ./positives     # High-confidence detections
    MaxPositiveCaptures: 1000

    EnableManualCapture: true              # GPIO-triggered capture
    ManualCaptureFolder: ./manual-captures
    MaxManualCaptures: 500
